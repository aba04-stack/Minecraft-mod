name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run static project checks
        run: python3 tools/validate_project.py
      - name: Build with checksum-pinned Gradle bootstrap
        run: ./gradlew build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: livingvillages-0.15.0
          path: build/libs/livingvillages-0.15.0.jar
          if-no-files-found: error
