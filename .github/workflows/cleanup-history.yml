name: Cleanup old Actions runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-history.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete Build mod runs and attached artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          KEEP_SUCCESSFUL=12
          KEEP_FAILURES=3

          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?per_page=100" > /tmp/all-runs.json

          jq \
            --argjson keep_success "$KEEP_SUCCESSFUL" \
            --argjson keep_fail "$KEEP_FAILURES" '
              [.[].workflow_runs[] | select(.workflow_id == 396002661)] as $runs
              | ([$runs[] | select(.conclusion == "success") | .id] | .[0:$keep_success]) as $success_ids
              | ([$runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | .id] | .[0:$keep_fail]) as $failure_ids
              | ([$runs[] | select(.status != "completed") | .id]) as $active_ids
              | ($success_ids + $failure_ids + $active_ids) as $keep_ids
              | {
                  total: ($runs | length),
                  keep: ($keep_ids | unique),
                  delete: [$runs[] | select(.status == "completed") | select((.id as $id | ($keep_ids | index($id)) == null)) | .id]
                }
            ' /tmp/all-runs.json > /tmp/cleanup-plan.json

          total="$(jq -r '.total' /tmp/cleanup-plan.json)"
          keep="$(jq -r '.keep | length' /tmp/cleanup-plan.json)"
          target="$(jq -r '.delete | length' /tmp/cleanup-plan.json)"
          echo "Found $total Build mod runs; keeping $keep and deleting $target obsolete completed runs."

          deleted=0
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api --method DELETE "repos/$REPOSITORY/actions/runs/$run_id"
            deleted=$((deleted + 1))
            if (( deleted % 25 == 0 )); then
              echo "Deleted $deleted / $target runs..."
            fi
          done < <(jq -r '.delete[]' /tmp/cleanup-plan.json)

          {
            echo "## GitHub Actions history cleanup"
            echo "- Build mod runs found: $total"
            echo "- Obsolete completed runs deleted: $deleted"
            echo "- Recent successful / failed runs and all active runs retained: $keep"
            echo "- Deleting workflow runs also removes their logs and attached artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
