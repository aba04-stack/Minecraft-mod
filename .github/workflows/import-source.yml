name: Import Living Villages source

on:
  push:
    paths:
      - .mod-import-trigger

permissions:
  contents: write

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode and expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat living-villages-mod.chunk-* > /tmp/living-villages-mod.zip.b64
          base64 --decode /tmp/living-villages-mod.zip.b64 > /tmp/living-villages-mod.zip
          mkdir -p /tmp/living-villages-import
          unzip -q /tmp/living-villages-mod.zip -d /tmp/living-villages-import
          source_dir="$(find /tmp/living-villages-import -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$source_dir/build.gradle"
          cp -a "$source_dir/." .
          rm -f living-villages-mod.chunk-* .mod-import-trigger .github/workflows/import-source.yml
          test -f README.md || cp README_RU.md README.md

      - name: Run project checks
        run: |
          python3 tools/validate_project.py
          java tools/JavaSyntaxCheck.java src/main/java
          for test_file in tools/test_*.py; do python3 "$test_file"; done
          sh -n gradlew BUILD_LOCAL.sh

      - name: Commit imported source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Living Villages 0.15.0 source and checks"
          git push

      - name: Build Minecraft mod
        run: ./gradlew build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livingvillages-0.15.0
          path: build/libs/livingvillages-0.15.0.jar
          if-no-files-found: error
