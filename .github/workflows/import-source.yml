name: Import Living Villages source

on:
  push:
    paths:
      - living-villages-mod.zip

permissions:
  contents: write

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Expand source archive and prepare repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/living-villages-import
          unzip -q living-villages-mod.zip -d /tmp/living-villages-import
          source_dir=/tmp/living-villages-import/living-villages-mod-0.15.0
          test -f "$source_dir/build.gradle"
          cp -a "$source_dir/." .
          rm -f living-villages-mod.zip .github/workflows/import-source.yml
          cp README_RU.md README.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          s = p.read_text(encoding="utf-8")
          old = "      - name: Run static project checks\n        run: python3 tools/validate_project.py\n"
          new = old + "      - name: Run regression and syntax checks\n        run: |\n          java tools/JavaSyntaxCheck.java src/main/java\n          for test_file in tools/test_*.py; do python3 \"$test_file\"; done\n          sh -n gradlew BUILD_LOCAL.sh\n"
          if old not in s:
              raise SystemExit("Could not find the expected validation step in build.yml")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          test -f README.md

      - name: Run project checks
        run: |
          python3 tools/validate_project.py
          java tools/JavaSyntaxCheck.java src/main/java
          for test_file in tools/test_*.py; do python3 "$test_file"; done
          sh -n gradlew BUILD_LOCAL.sh

      - name: Commit imported source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Living Villages 0.15.0 source and checks"
          git push

      - name: Build Minecraft mod
        run: ./gradlew build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livingvillages-0.15.0
          path: build/libs/livingvillages-0.15.0.jar
          if-no-files-found: error
